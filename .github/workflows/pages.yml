name: Build STT demo and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SHERPA_VERSION: v1.13.5
  EMSDK_VERSION: 4.0.23
  WORKFLOW_REVISION: v10.7-workerfs-diagnostics
  PARAKEET_MODEL: sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
  PARAKEET_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
  PARAKEET_NEMO_URL: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v2/resolve/main/parakeet-tdt-0.6b-v2.nemo?download=true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show workflow revision
        run: |
          echo "WORKFLOW_REVISION=$WORKFLOW_REVISION"
          echo "Expected: v10.7-workerfs-diagnostics"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore Parakeet model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-model
          key: parakeet-v2-int8-model-v1

      - name: Download Parakeet INT8 model files
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/parakeet-model .model-download
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .model-download/parakeet.tar.bz2 "$PARAKEET_MODEL_URL"
          tar -xjf .model-download/parakeet.tar.bz2 -C .model-download
          MODEL_DIR=".model-download/$PARAKEET_MODEL"
          test -s "$MODEL_DIR/encoder.int8.onnx"
          cp "$MODEL_DIR/encoder.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/decoder.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/joiner.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/tokens.txt" .cache/parakeet-model/
          rm -rf .model-download
          ls -lh .cache/parakeet-model

      - name: Restore prebuilt sherpa WORKERFS runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-runtime
          key: parakeet-wasm-${{ env.SHERPA_VERSION }}-workerfs-v10.7

      - name: Restore BPE vocab cache
        id: bpe-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-bpe
          key: parakeet-v2-bpe-${{ hashFiles('scripts/generate_bpe_vocab.py') }}

      - name: Install build prerequisites
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates bzip2 \
            python3 python3-venv python3-pip

      - name: Download sherpa-onnx source
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .sherpa-build
          mkdir -p .sherpa-build
          git clone --depth 1 --branch "$SHERPA_VERSION" \
            https://github.com/k2-fsa/sherpa-onnx.git .sherpa-build/sherpa-onnx

      - name: Prepare exact BPE vocab for hotwords
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/parakeet-bpe

          if [ ! -s .cache/parakeet-bpe/bpe.vocab ]; then
            echo "Generating exact bpe.vocab from NVIDIA SentencePiece tokenizer"
            curl -L --fail --retry 5 --retry-delay 3 \
              -o .sherpa-build/parakeet-v2.nemo "$PARAKEET_NEMO_URL"
            python3 -m venv .sherpa-build/bpe-venv
            .sherpa-build/bpe-venv/bin/pip install --disable-pip-version-check sentencepiece
            .sherpa-build/bpe-venv/bin/python scripts/generate_bpe_vocab.py \
              .sherpa-build/parakeet-v2.nemo .cache/parakeet-bpe/bpe.vocab
            rm -f .sherpa-build/parakeet-v2.nemo
          fi

          test -s .cache/parakeet-bpe/bpe.vocab
          head -n 3 .cache/parakeet-bpe/bpe.vocab

      - name: Prepare SMALL sherpa WASM assets
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SHERPA=.sherpa-build/sherpa-onnx
          ASSETS="$SHERPA/wasm/vad-asr/assets"
          mkdir -p "$ASSETS"
          find "$ASSETS" -mindepth 1 ! -name README.md -exec rm -rf {} +

          # These files satisfy sherpa's configure-time checks only.
          # v10.7 removes --preload-file, so no Emscripten .data is generated.
          # At runtime these support files are served separately and mounted via WORKERFS.
          cp .cache/parakeet-model/tokens.txt "$ASSETS/tokens.txt"
          cp .cache/parakeet-bpe/bpe.vocab "$ASSETS/bpe.vocab"
          curl -L --fail --retry 5 --retry-delay 3 \
            -o "$ASSETS/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

          ls -lh "$ASSETS"

      - name: Patch sherpa WASM target for WORKERFS without .data
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          echo "WORKFLOW_REVISION=$WORKFLOW_REVISION"
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.sherpa-build/sherpa-onnx/wasm/vad-asr/CMakeLists.txt')
          s = p.read_text()

          # Export FS only. WORKERFS is linked as a JS filesystem backend.
          old = "'HEAPU8','HEAP16','HEAP32','HEAPU32','HEAPF32','HEAPF64']"
          new = "'HEAPU8','HEAP16','HEAP32','HEAPU32','HEAPF32','HEAPF64','FS']"
          if old not in s:
              raise SystemExit('Could not find official EXPORTED_RUNTIME_METHODS tail')
          s = s.replace(old, new, 1)

          # No preload package at all: tokenizer/support files will also be
          # fetched as Blobs and mounted through WORKERFS at runtime.
          preload = 'string(APPEND MY_FLAGS "--preload-file ${CMAKE_CURRENT_SOURCE_DIR}/assets@. ")\n'
          if preload not in s:
              raise SystemExit('Could not find official --preload-file line')
          s = s.replace(preload, '', 1)

          # Link WORKERFS on the executable only.
          marker = 'target_link_libraries(sherpa-onnx-wasm-main-vad-asr sherpa-onnx-c-api)'
          addition = marker + '\n' + (
              'target_link_options(sherpa-onnx-wasm-main-vad-asr PRIVATE '
              '"-lworkerfs.js" "-sENVIRONMENT=worker")'
          )
          if marker not in s:
              raise SystemExit('Could not find target_link_libraries marker')
          s = s.replace(marker, addition, 1)

          # sherpa's upstream install list assumes --preload-file generated a
          # .data file. Since v10.7 intentionally has no .data, remove only
          # that install entry.
          data_install = '    "$<TARGET_FILE_DIR:sherpa-onnx-wasm-main-vad-asr>/sherpa-onnx-wasm-main-vad-asr.data"\n'
          if data_install not in s:
              raise SystemExit('Could not find upstream .data install entry')
          s = s.replace(data_install, '', 1)

          p.write_text(s)

          runtime_lines = [x for x in s.splitlines() if 'EXPORTED_RUNTIME_METHODS' in x]
          if len(runtime_lines) != 1:
              raise SystemExit(f'Unexpected runtime export lines: {runtime_lines}')
          line = runtime_lines[0]
          print('FINAL EXPORTED_RUNTIME_METHODS:', line)
          if 'WORKERFS' in line:
              raise SystemExit('BUG: WORKERFS must not be in EXPORTED_RUNTIME_METHODS')
          if "'FS'" not in line:
              raise SystemExit('BUG: FS missing from EXPORTED_RUNTIME_METHODS')
          if '--preload-file' in s:
              raise SystemExit('BUG: --preload-file still present; .data would be generated')
          if 'sherpa-onnx-wasm-main-vad-asr.data' in s:
              raise SystemExit('BUG: .data is still referenced by CMake install')
          if 'target_link_options(sherpa-onnx-wasm-main-vad-asr PRIVATE "-lworkerfs.js"' not in s:
              raise SystemExit('BUG: target-specific -lworkerfs.js is missing')
          PY

          echo '--- WORKFLOW REVISION ---'
          echo "$WORKFLOW_REVISION"
          echo '--- Patched CMake ---'
          grep -n "EXPORTED_RUNTIME_METHODS\|target_link_options\|target_link_libraries\|preload-file\|\.data" \
            .sherpa-build/sherpa-onnx/wasm/vad-asr/CMakeLists.txt || true

      - name: Install Emscripten 4.0.23
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .sherpa-build/emsdk
          .sherpa-build/emsdk/emsdk install "$EMSDK_VERSION"
          .sherpa-build/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build sherpa-onnx 1.13.5 WASM + WORKERFS
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          source .sherpa-build/emsdk/emsdk_env.sh
          cd .sherpa-build/sherpa-onnx
          ./build-wasm-simd-vad-asr.sh

          OUT=build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          test -s "$OUT/sherpa-onnx-asr.js"
          test -s "$OUT/sherpa-onnx-wasm-main-vad-asr.js"
          test -s "$OUT/sherpa-onnx-wasm-main-vad-asr.wasm"
          test ! -e "$OUT/sherpa-onnx-wasm-main-vad-asr.data"

          # Fail the build immediately if libworkerfs.js was not linked into the generated runtime.
          if ! grep -q "WORKERFS" "$OUT/sherpa-onnx-wasm-main-vad-asr.js"; then
            echo "ERROR: generated sherpa runtime does not contain WORKERFS" >&2
            exit 1
          fi
          echo "WORKERFS found in generated runtime"

          # v10.7 deliberately has no Emscripten .data package at all.
          echo "OK: no Emscripten .data package generated"

          mkdir -p ../../.cache/parakeet-runtime
          cp "$OUT/sherpa-onnx-asr.js" ../../.cache/parakeet-runtime/
          cp "$OUT/sherpa-onnx-wasm-main-vad-asr.js" ../../.cache/parakeet-runtime/
          cp "$OUT/sherpa-onnx-wasm-main-vad-asr.wasm" ../../.cache/parakeet-runtime/
          cp wasm/vad-asr/assets/silero_vad.onnx ../../.cache/parakeet-runtime/
          cp wasm/vad-asr/assets/tokens.txt ../../.cache/parakeet-runtime/
          cp ../../.cache/parakeet-bpe/bpe.vocab ../../.cache/parakeet-runtime/
          printf '%s\n' \
            "sherpa-onnx=$SHERPA_VERSION" \
            "model=$PARAKEET_MODEL" \
            "storage=no .data; ONNX + tokenizer assets via WORKERFS" \
            "decoding=modified_beam_search" \
            "hotwords=bpe.vocab + hotwords_file" \
            > ../../.cache/parakeet-runtime/VERSION.txt

      - name: Install runtime and external model into site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf public/parakeet-sherpa public/parakeet-model
          mkdir -p public/parakeet-sherpa public/parakeet-model
          cp -a .cache/parakeet-runtime/. public/parakeet-sherpa/
          cp .cache/parakeet-model/encoder.int8.onnx public/parakeet-model/
          cp .cache/parakeet-model/decoder.int8.onnx public/parakeet-model/
          cp .cache/parakeet-model/joiner.int8.onnx public/parakeet-model/
          ls -lh public/parakeet-sherpa public/parakeet-model

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/whisper-worker.js
          node --check public/parakeet-worker.js

      - name: Build frontend
        run: npm run build

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/index.html
          test -s dist/parakeet-worker.js
          test -s dist/parakeet-sherpa/sherpa-onnx-asr.js
          test -s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.js
          test -s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.wasm
          test ! -e dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.data
          test -s dist/parakeet-sherpa/tokens.txt
          test -s dist/parakeet-sherpa/bpe.vocab
          test -s dist/parakeet-sherpa/silero_vad.onnx
          test -s dist/parakeet-model/encoder.int8.onnx
          test -s dist/parakeet-model/decoder.int8.onnx
          test -s dist/parakeet-model/joiner.int8.onnx
          echo "OK: published site has no Emscripten .data package"
          du -sh dist

      - name: Upload sherpa WORKERFS runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-parakeet-workerfs-runtime
          path: public/parakeet-sherpa
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
