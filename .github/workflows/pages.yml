name: Build STT demo and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SHERPA_VERSION: v1.13.5
  EMSDK_VERSION: 4.0.23
  PARAKEET_MODEL: sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8
  PARAKEET_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8.tar.bz2
  PARAKEET_NEMO_URL: https://huggingface.co/nvidia/parakeet-tdt-0.6b-v2/resolve/main/parakeet-tdt-0.6b-v2.nemo?download=true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Restore Parakeet model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-model
          key: parakeet-v2-int8-model-v1

      - name: Download Parakeet INT8 model files
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/parakeet-model .model-download
          curl -L --fail --retry 5 --retry-delay 3 \
            -o .model-download/parakeet.tar.bz2 "$PARAKEET_MODEL_URL"
          tar -xjf .model-download/parakeet.tar.bz2 -C .model-download
          MODEL_DIR=".model-download/$PARAKEET_MODEL"
          test -s "$MODEL_DIR/encoder.int8.onnx"
          cp "$MODEL_DIR/encoder.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/decoder.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/joiner.int8.onnx" .cache/parakeet-model/
          cp "$MODEL_DIR/tokens.txt" .cache/parakeet-model/
          rm -rf .model-download
          ls -lh .cache/parakeet-model

      - name: Restore prebuilt sherpa WORKERFS runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-runtime
          key: parakeet-wasm-${{ env.SHERPA_VERSION }}-workerfs-v10.1

      - name: Restore BPE vocab cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        id: bpe-cache
        uses: actions/cache@v4
        with:
          path: .cache/parakeet-bpe
          key: parakeet-v2-bpe-${{ hashFiles('scripts/generate_bpe_vocab.py') }}

      - name: Install build prerequisites
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git curl ca-certificates bzip2 \
            python3 python3-venv python3-pip

      - name: Download sherpa-onnx source
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .sherpa-build
          mkdir -p .sherpa-build
          git clone --depth 1 --branch "$SHERPA_VERSION" \
            https://github.com/k2-fsa/sherpa-onnx.git .sherpa-build/sherpa-onnx

      - name: Prepare exact BPE vocab for hotwords
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .cache/parakeet-bpe

          if [ ! -s .cache/parakeet-bpe/bpe.vocab ]; then
            echo "Generating exact bpe.vocab from NVIDIA SentencePiece tokenizer"
            curl -L --fail --retry 5 --retry-delay 3 \
              -o .sherpa-build/parakeet-v2.nemo "$PARAKEET_NEMO_URL"
            python3 -m venv .sherpa-build/bpe-venv
            .sherpa-build/bpe-venv/bin/pip install --disable-pip-version-check sentencepiece
            .sherpa-build/bpe-venv/bin/python scripts/generate_bpe_vocab.py \
              .sherpa-build/parakeet-v2.nemo .cache/parakeet-bpe/bpe.vocab
            rm -f .sherpa-build/parakeet-v2.nemo
          fi

          test -s .cache/parakeet-bpe/bpe.vocab
          head -n 3 .cache/parakeet-bpe/bpe.vocab

      - name: Prepare SMALL sherpa WASM assets
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          SHERPA=.sherpa-build/sherpa-onnx
          ASSETS="$SHERPA/wasm/vad-asr/assets"
          mkdir -p "$ASSETS"
          find "$ASSETS" -maxdepth 1 -type f ! -name README.md -delete

          # Only small assets remain in Emscripten .data.
          # The ~630 MB ONNX graphs are served separately and mounted through WORKERFS.
          cp .cache/parakeet-model/tokens.txt "$ASSETS/tokens.txt"
          cp .cache/parakeet-bpe/bpe.vocab "$ASSETS/bpe.vocab"
          curl -L --fail --retry 5 --retry-delay 3 \
            -o "$ASSETS/silero_vad.onnx" \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx

          ls -lh "$ASSETS"

      - name: Patch sherpa WASM target for WORKERFS
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('.sherpa-build/sherpa-onnx/wasm/vad-asr/CMakeLists.txt')
          s = p.read_text()

          old = "'HEAPU8','HEAP16','HEAP32','HEAPU32','HEAPF32','HEAPF64']"
          new = "'HEAPU8','HEAP16','HEAP32','HEAPU32','HEAPF32','HEAPF64','FS','WORKERFS']"
          if old not in s:
              raise SystemExit('Could not find EXPORTED_RUNTIME_METHODS list to patch')
          s = s.replace(old, new, 1)

          marker = 'set(CMAKE_EXECUTABLE_LINKER_FLAGS "${CMAKE_EXECUTABLE_LINKER_FLAGS} ${MY_FLAGS}")'
          replacement = marker + '\nstring(APPEND CMAKE_EXECUTABLE_LINKER_FLAGS " -lworkerfs.js -sENVIRONMENT=worker ")'
          if marker not in s:
              raise SystemExit('Could not find linker flags marker to patch')
          s = s.replace(marker, replacement, 1)

          p.write_text(s)
          PY

          grep -n "WORKERFS\|workerfs" .sherpa-build/sherpa-onnx/wasm/vad-asr/CMakeLists.txt

      - name: Install Emscripten 4.0.23
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git .sherpa-build/emsdk
          .sherpa-build/emsdk/emsdk install "$EMSDK_VERSION"
          .sherpa-build/emsdk/emsdk activate "$EMSDK_VERSION"

      - name: Build sherpa-onnx 1.13.5 WASM + WORKERFS
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euxo pipefail
          source .sherpa-build/emsdk/emsdk_env.sh
          cd .sherpa-build/sherpa-onnx
          ./build-wasm-simd-vad-asr.sh

          OUT=build-wasm-simd-vad-asr/install/bin/wasm/vad-asr
          test -s "$OUT/sherpa-onnx-asr.js"
          test -s "$OUT/sherpa-onnx-wasm-main-vad-asr.js"
          test -s "$OUT/sherpa-onnx-wasm-main-vad-asr.wasm"
          test -s "$OUT/sherpa-onnx-wasm-main-vad-asr.data"

          # Fail the build immediately if libworkerfs.js was not linked into the generated runtime.
          if ! grep -q "WORKERFS" "$OUT/sherpa-onnx-wasm-main-vad-asr.js"; then
            echo "ERROR: generated sherpa runtime does not contain WORKERFS" >&2
            exit 1
          fi
          echo "WORKERFS found in generated runtime"

          # The .data bundle must stay small: no Parakeet ONNX weights inside it.
          DATA_BYTES=$(stat -c%s "$OUT/sherpa-onnx-wasm-main-vad-asr.data")
          echo "runtime .data size: $DATA_BYTES bytes"
          test "$DATA_BYTES" -lt 50000000

          mkdir -p ../../.cache/parakeet-runtime
          cp "$OUT/sherpa-onnx-asr.js" ../../.cache/parakeet-runtime/
          cp "$OUT/sherpa-onnx-wasm-main-vad-asr.js" ../../.cache/parakeet-runtime/
          cp "$OUT/sherpa-onnx-wasm-main-vad-asr.wasm" ../../.cache/parakeet-runtime/
          cp "$OUT/sherpa-onnx-wasm-main-vad-asr.data" ../../.cache/parakeet-runtime/
          printf '%s\n' \
            "sherpa-onnx=$SHERPA_VERSION" \
            "model=$PARAKEET_MODEL" \
            "storage=external ONNX + WORKERFS" \
            "decoding=modified_beam_search" \
            "hotwords=bpe.vocab + hotwords_file" \
            > ../../.cache/parakeet-runtime/VERSION.txt

      - name: Install runtime and external model into site
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf public/parakeet-sherpa public/parakeet-model
          mkdir -p public/parakeet-sherpa public/parakeet-model
          cp -a .cache/parakeet-runtime/. public/parakeet-sherpa/
          cp .cache/parakeet-model/encoder.int8.onnx public/parakeet-model/
          cp .cache/parakeet-model/decoder.int8.onnx public/parakeet-model/
          cp .cache/parakeet-model/joiner.int8.onnx public/parakeet-model/
          ls -lh public/parakeet-sherpa public/parakeet-model

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/whisper-worker.js
          node --check public/parakeet-worker.js

      - name: Build frontend
        run: npm run build

      - name: Verify Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -s dist/index.html
          test -s dist/parakeet-worker.js
          test -s dist/parakeet-sherpa/sherpa-onnx-asr.js
          test -s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.js
          test -s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.wasm
          test -s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.data
          test -s dist/parakeet-model/encoder.int8.onnx
          test -s dist/parakeet-model/decoder.int8.onnx
          test -s dist/parakeet-model/joiner.int8.onnx
          DATA_BYTES=$(stat -c%s dist/parakeet-sherpa/sherpa-onnx-wasm-main-vad-asr.data)
          echo "published runtime .data: $DATA_BYTES bytes"
          test "$DATA_BYTES" -lt 50000000
          du -sh dist

      - name: Upload sherpa WORKERFS runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherpa-parakeet-workerfs-runtime
          path: public/parakeet-sherpa
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
